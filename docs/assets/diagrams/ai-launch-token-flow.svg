<svg viewBox="0 0 880 668" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">AI launch token: what each side does</title>
  <desc id="desc">The handshake between the box and an external AI challenge site, and which key does what. The box mints an Ed25519 JWT scoped to one challenge (sub is the player's login, aud is the challenge id, 24-hour expiry, jti as the replay nonce) and substitutes it into the challenge's launch URL wherever the operator wrote the {token} placeholder. The contestant opens that link on the external site, which fetches the module-wide public key from /api/ai/launch-key and caches it for about five minutes, re-fetching on any verification failure, then verifies with hard-coded Ed25519, never trusting the token's own alg or kid, pinning aud to the challenge it expects. The site re-reads GET /api/ai/state rather than trusting the token's mint-time progress snapshot. On a solve it POSTs /api/ai/event with the token and challenge id, signed with that challenge's own secret HMAC key over the exact string timestamp-dot-raw-body. The box checks the signature within 300 seconds, then the token, then claims the jti exactly once, so a replay gets 409, and the shared atomic award script banks the points. The launch key is public, one per event, and fetched; the signing key is secret, one per challenge, and pasted in from the admin panel.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="668" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="667" rx="10" fill="none" stroke="var(--border)"/>

  <text x="30" y="36" font-size="10" fill="var(--text-muted)" letter-spacing="1">THE BOX &#183; ALREADY RUNNING</text>
  <rect x="30" y="44" width="385" height="604" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="6 4"/>

  <text x="465" y="36" font-size="10" fill="var(--text-muted)" letter-spacing="1">YOUR CHALLENGE SITE &#183; WHAT YOU CONFIGURE</text>
  <rect x="465" y="44" width="385" height="496" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="6 4"/>

  <rect x="45" y="58" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="222" y="84" text-anchor="middle" font-size="13" fill="var(--text-bright)">mint the launch token</text>
  <text x="222" y="103" text-anchor="middle" font-size="10" fill="var(--text-muted)">Ed25519 JWT &#183; sub = login &#183; aud = challenge id</text>
  <text x="222" y="121" text-anchor="middle" font-size="10" fill="var(--text-muted)">24 h expiry &#183; jti = the one-shot replay nonce</text>

  <path class="dgm-flow" d="M400 110 C 444 126 450 152 474 176" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <text x="45" y="172" font-size="10" fill="var(--text-muted)" letter-spacing="1">THE TWO KEYS</text>
  <rect x="45" y="180" width="355" height="110" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 4"/>
  <text x="222" y="208" text-anchor="middle" font-size="11" fill="var(--text-bright)">launch key &#183; PUBLIC &#183; one per event</text>
  <text x="222" y="226" text-anchor="middle" font-size="10" fill="var(--text-muted)">your site FETCHES it from /api/ai/launch-key</text>
  <text x="222" y="256" text-anchor="middle" font-size="11" fill="var(--text-bright)">signing key &#183; SECRET &#183; one per challenge</text>
  <text x="222" y="274" text-anchor="middle" font-size="10" fill="var(--text-muted)">you PASTE it in from the admin panel</text>

  <rect x="480" y="156" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="657" y="182" text-anchor="middle" font-size="13" fill="var(--text-bright)">the launch link opens</text>
  <text x="657" y="201" text-anchor="middle" font-size="10" fill="var(--text-muted)">your launch URL, with {token} substituted</text>
  <text x="657" y="219" text-anchor="middle" font-size="10" fill="var(--text-muted)">no cookies cross &#8212; the token is the identity</text>

  <line class="dgm-flow" x1="657" y1="238" x2="657" y2="254" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="480" y="260" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="657" y="286" text-anchor="middle" font-size="13" fill="var(--text-bright)">verify it</text>
  <text x="657" y="305" text-anchor="middle" font-size="10" fill="var(--text-muted)">GET /api/ai/launch-key &#183; cache ~5 m &#183; re-fetch on failure</text>
  <text x="657" y="323" text-anchor="middle" font-size="10" fill="var(--text-muted)">hard-code Ed25519 &#183; pin aud &#183; ignore alg and kid</text>

  <line class="dgm-flow" x1="657" y1="342" x2="657" y2="358" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="480" y="364" width="355" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="657" y="390" text-anchor="middle" font-size="13" fill="var(--text-bright)">the contestant plays</text>
  <text x="657" y="409" text-anchor="middle" font-size="10" fill="var(--text-muted)">re-read GET /api/ai/state, not the mint-time snapshot</text>

  <line class="dgm-flow" x1="657" y1="428" x2="657" y2="444" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="480" y="450" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="657" y="476" text-anchor="middle" font-size="13" fill="var(--text-bright)">report the solve</text>
  <text x="657" y="495" text-anchor="middle" font-size="10" fill="var(--text-muted)">POST /api/ai/event {token, challengeId}</text>
  <text x="657" y="513" text-anchor="middle" font-size="10" fill="var(--text-muted)">HMAC the exact bytes: &#8220;&lt;timestamp&gt;.&lt;raw body&gt;&#8221;</text>

  <line class="dgm-ants" x1="476" y1="489" x2="406" y2="489" stroke="var(--accent)" marker-end="url(#arR)"/>

  <rect class="dgm-gate" x="45" y="450" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="222" y="476" text-anchor="middle" font-size="13" fill="var(--text-bright)">the box checks, in order</text>
  <text x="222" y="495" text-anchor="middle" font-size="10" fill="var(--text-muted)">signature (&#177;300 s) &#8594; token &#8594; jti claimed once</text>
  <text x="222" y="513" text-anchor="middle" font-size="10" fill="var(--text-muted)">a replayed jti gets 409, not a second award</text>

  <line class="dgm-flow" x1="222" y1="532" x2="222" y2="548" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="45" y="554" width="355" height="78" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="222" y="580" text-anchor="middle" font-size="13" fill="var(--text-bright)">points banked</text>
  <text x="222" y="599" text-anchor="middle" font-size="10" fill="var(--text-muted)">the same atomic award script every surface uses</text>
  <text x="222" y="617" text-anchor="middle" font-size="10" fill="var(--text-muted)">dryRun: true runs all of it and writes nothing</text>

</svg>
