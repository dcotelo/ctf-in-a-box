<svg viewBox="0 0 880 486" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">AI data flow</title>
  <desc id="desc">The challenge page mints an Ed25519 launch token after four gates and embeds it in the launcher href. A solve can arrive three ways: an in-box Server Action that re-runs the gate order, an external submit endpoint authenticated by the token alone, or an external event endpoint authenticated by an HMAC signature then the token then a replay nonce. All three funnel into one shared atomic AWARD_SCRIPT. AI points are then ADDED to the leaderboard, never attributed, and a team's total is the union of its members' solved challenges, never their sum.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="486" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="485" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="18" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">RUNTIME &#183; THREE ENTRY SURFACES, ONE GRADER</text>

  <rect x="320" y="40" width="240" height="58" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="var(--text-bright)">launch mint</text>
  <text x="440" y="82" text-anchor="middle" font-size="10" fill="var(--text-muted)">4 gates &#8594; Ed25519 &#8594; launcher href</text>

  <path class="dgm-flow" d="M400 100 C 330 118 240 130 165 146" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <path class="dgm-flow" d="M440 100 L440 148" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <path class="dgm-flow" d="M480 100 C 550 118 640 130 715 146" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <text x="20" y="136" font-size="10" fill="var(--text-muted)" letter-spacing="1">THREE ENTRY SURFACES</text>

  <rect x="20" y="142" width="840" height="86" rx="10" fill="none" stroke="var(--border)" stroke-dasharray="4 4"/>

  <rect class="dgm-gate" x="40" y="152" width="250" height="64" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="165" y="180" text-anchor="middle" font-size="13" fill="var(--text-bright)">in-box action</text>
  <text x="165" y="198" text-anchor="middle" font-size="10" fill="var(--text-muted)">re-runs gate order &#183; submitAiFlag</text>

  <rect class="dgm-gate dgm-g2" x="315" y="152" width="250" height="64" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="180" text-anchor="middle" font-size="13" fill="var(--text-bright)">external submit</text>
  <text x="440" y="198" text-anchor="middle" font-size="10" fill="var(--text-muted)">{token, flag} &#183; cookie-blind</text>

  <rect class="dgm-gate dgm-g3" x="590" y="152" width="250" height="64" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="715" y="180" text-anchor="middle" font-size="13" fill="var(--text-bright)">external event</text>
  <text x="715" y="198" text-anchor="middle" font-size="10" fill="var(--text-muted)">HMAC &#8594; token &#8594; replay nonce</text>

  <path class="dgm-ants" d="M165 232 C 230 244 300 248 374 252" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>
  <path class="dgm-ants" d="M440 232 L440 250" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>
  <path class="dgm-ants" d="M715 232 C 650 244 580 248 506 252" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>

  <rect x="310" y="254" width="260" height="58" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="278" text-anchor="middle" font-size="13" fill="var(--text-bright)">shared AWARD_SCRIPT</text>
  <text x="440" y="296" text-anchor="middle" font-size="10" fill="var(--text-muted)">one atomic script, all three surfaces</text>

  <path class="dgm-flow" d="M556 310 C 630 332 682 342 719 352" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="610" y="360" width="230" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="725" y="384" text-anchor="middle" font-size="13" fill="var(--text-bright)">redis</text>
  <text x="725" y="402" text-anchor="middle" font-size="10" fill="var(--text-muted)">solve row + aggregates bumped</text>

  <line class="dgm-flow" x1="606" y1="387" x2="560" y2="387" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="325" y="360" width="230" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="384" text-anchor="middle" font-size="13" fill="var(--text-bright)">leaderboard overlay</text>
  <text x="440" y="402" text-anchor="middle" font-size="10" fill="var(--text-muted)">ADDS points, never attributed</text>

  <line class="dgm-flow" x1="321" y1="387" x2="275" y2="387" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="40" y="360" width="230" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="155" y="384" text-anchor="middle" font-size="13" fill="var(--text-bright)">team total</text>
  <text x="155" y="402" text-anchor="middle" font-size="10" fill="var(--text-muted)">union of members</text>

  <text x="40" y="446" font-size="10" fill="var(--text-muted)">all three surfaces funnel into the same atomic award script &#8212; no surface has its own grading path</text>
  <text x="40" y="462" font-size="10" fill="var(--text-muted)">a team's total is the union of its members' solved challenges, never their sum</text>
</svg>
