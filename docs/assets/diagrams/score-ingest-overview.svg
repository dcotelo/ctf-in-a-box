<svg viewBox="0 0 880 448" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">Score ingest: poll or push</title>
  <desc id="desc">A contestant answers quiz and classic challenges in the app, and opens a patch PR against a fork in the event org. The fork's Action runs the rubric and posts a score comment on the PR. In poll mode sync pulls that comment about every 30 seconds, needing no inbound network surface; in push mode the Action POSTs the score straight to the scorer, which is near-instant but needs a public URL. Either way the score enters through one audited writer, the scorer's bearer-authed POST /score, which validates and writes monotonically into redis, and the app renders the live leaderboard from it.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="448" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="447" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="20" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">SCORE INGEST &#183; POLL OR PUSH, ONE AUDITED WRITER</text>

  <rect x="30" y="180" width="170" height="56" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="115" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">contestant</text>

  <path class="dgm-flow" d="M204 188 C 240 148 250 112 270 94" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="212" y="150" font-size="10" fill="var(--text-muted)">quiz &amp; classic answers</text>

  <path class="dgm-flow" d="M204 228 C 240 268 250 302 270 318" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="212" y="278" font-size="10" fill="var(--text-muted)">patch + PR</text>

  <rect x="280" y="60" width="190" height="56" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="375" y="94" text-anchor="middle" font-size="13" fill="var(--text-bright)">app</text>

  <line class="dgm-flow" x1="474" y1="88" x2="552" y2="88" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="560" y="60" width="200" height="56" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="660" y="94" text-anchor="middle" font-size="13" fill="var(--text-bright)">live leaderboard</text>

  <line class="dgm-flow" x1="375" y1="120" x2="375" y2="174" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="290" y="180" width="170" height="56" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="375" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">redis</text>

  <rect x="280" y="290" width="190" height="64" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="375" y="316" text-anchor="middle" font-size="13" fill="var(--text-bright)">fork</text>
  <text x="375" y="334" text-anchor="middle" font-size="10" fill="var(--text-muted)">in the event org</text>

  <line class="dgm-flow" x1="474" y1="322" x2="552" y2="322" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="513" y="312" text-anchor="middle" font-size="10" fill="var(--text-muted)">rubric</text>

  <rect x="560" y="290" width="200" height="64" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="660" y="316" text-anchor="middle" font-size="13" fill="var(--text-bright)">score comment</text>
  <text x="660" y="334" text-anchor="middle" font-size="10" fill="var(--text-muted)">on the PR</text>

  <line class="dgm-ants" x1="660" y1="286" x2="660" y2="244" stroke="var(--accent-2)" marker-end="url(#arB)"/>
  <text x="672" y="270" font-size="10" fill="var(--accent-2)">poll &#183; every ~30 s</text>

  <path class="dgm-ants" d="M474 300 C 512 290 522 248 550 222" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>
  <text x="516" y="246" text-anchor="end" font-size="10" fill="var(--accent)">push &#183; instant</text>

  <rect class="dgm-gate" x="560" y="180" width="200" height="56" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="660" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">scorer</text>

  <line class="dgm-flow" x1="556" y1="208" x2="468" y2="208" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <text x="30" y="396" font-size="10" fill="var(--text-muted)">poll &#8212; zero inbound network surface; works behind NAT and venue wifi</text>
  <text x="30" y="412" font-size="10" fill="var(--text-muted)">push &#8212; near-instant, but needs a public URL</text>
  <text x="30" y="428" font-size="10" fill="var(--text-muted)">either way the score enters through one audited writer: scorer's bearer-authed POST /score, written monotonically</text>
</svg>
