<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">Build-time config flow</title>
  <desc id="desc">The organizer edits event.yaml, which is base64-encoded into the EVENT_CONFIG_B64 build arg; the Dockerfile decodes it back to a file; the prebuild script resolves config with priority yaml file over EVENT_* env vars over neutral defaults, and writes a typed, gitignored event-config.generated.ts; the bake supplies the event's dates, secure-development's target list, and the admins list, while which modules are enabled is decided at runtime in /admin, not baked; next build statically renders all of it. The event's dates and targets are baked into the image at build time, not read at request time, so building with EVENT_CONFIG_B64 unset silently yields neutral defaults and an empty admins list; the event's identity (name, tagline, location, contact, Discord) is a runtime /admin setting instead (issue #386), never baked.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="420" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="419" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="20" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">BUILD TIME &#183; BEFORE ANY CONTAINER RUNS</text>

  <rect x="40" y="54" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="var(--text-bright)">event.yaml</text>
  <text x="160" y="99" text-anchor="middle" font-size="10" fill="var(--text-muted)">organizer edits</text>

  <line class="dgm-flow" x1="284" y1="84" x2="312" y2="84" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="320" y="54" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="80" text-anchor="middle" font-size="13" fill="var(--text-bright)">EVENT_CONFIG_B64</text>
  <text x="440" y="99" text-anchor="middle" font-size="10" fill="var(--text-muted)">base64 build-arg</text>

  <line class="dgm-flow" x1="564" y1="84" x2="592" y2="84" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="600" y="54" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="720" y="80" text-anchor="middle" font-size="13" fill="var(--text-bright)">apps/web/Dockerfile</text>
  <text x="720" y="99" text-anchor="middle" font-size="10" fill="var(--text-muted)">decodes to /app/event.yaml</text>

  <line class="dgm-flow" x1="720" y1="118" x2="720" y2="174" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="600" y="180" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="720" y="206" text-anchor="middle" font-size="12" fill="var(--text-bright)">generate-event-config.mjs</text>
  <text x="720" y="225" text-anchor="middle" font-size="10" fill="var(--text-muted)">yaml &gt; EVENT_* env &gt; defaults</text>

  <line class="dgm-flow" x1="596" y1="210" x2="568" y2="210" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="320" y="180" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="206" text-anchor="middle" font-size="12" fill="var(--text-bright)">event-config.generated.ts</text>
  <text x="440" y="225" text-anchor="middle" font-size="10" fill="var(--text-muted)">typed const, gitignored</text>

  <line class="dgm-flow" x1="316" y1="210" x2="288" y2="210" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="40" y="180" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="160" y="206" text-anchor="middle" font-size="12" fill="var(--text-bright)">modules &#183; apps &#183; site</text>
  <text x="160" y="225" text-anchor="middle" font-size="10" fill="var(--text-muted)">enabledModules, nav links</text>

  <path class="dgm-ants" d="M160 244 C 160 300 240 330 314 330" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>

  <rect class="dgm-gate" x="320" y="300" width="240" height="60" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="326" text-anchor="middle" font-size="13" fill="var(--text-bright)">next build</text>
  <text x="440" y="345" text-anchor="middle" font-size="10" fill="var(--text-muted)">baked into the image</text>

  <text x="596" y="326" font-size="10" fill="var(--text-muted)">dates &amp; targets bake in at build time;</text>
  <text x="596" y="342" font-size="10" fill="var(--text-muted)">identity is a runtime /admin setting</text>

  <text x="40" y="392" font-size="10" fill="var(--text-muted)">build the app with EVENT_CONFIG_B64 unset and it silently yields neutral defaults &#8212;</text>
  <text x="40" y="408" font-size="10" fill="var(--text-muted)">an empty admins list, so /admin 403s for everyone</text>
</svg>
