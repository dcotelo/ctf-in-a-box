services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile.${SCORE_INGEST:-poll}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      EVENT_HOST: ${EVENT_URL:-http://localhost}

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        EVENT_CONFIG_B64: ${EVENT_CONFIG_B64:-}
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${EVENT_URL:-http://localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      LEADERBOARD_SOURCE: lambda          # plain-HTTP adapter; reads the local scorer
      LEADERBOARD_API_URL: http://scorer:4000
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      TEAM_WRITES_ENABLED: "true"
      # Runtime flag: exposes the /admin "Seed demo data" button + its route.
      # Set to "1" only for demos (dev-stack does). Never in a real event.
      DEMO_MODE: ${DEMO_MODE:-}
      # Boot-time default for paid hints. Read once per server process, so a
      # change here takes effect on `docker compose up -d` (container
      # recreate) — no image rebuild needed, unlike EVENT_CONFIG_B64 above,
      # which is a build ARG because a prebuild step turns it into a source
      # file. Unset expands to "" and hints stay ON, which is the documented
      # default; only the literal "false" disables them. /admin's hint
      # controls are the live override on top of this.
      HINTS_ENABLED: ${HINTS_ENABLED:-}
    # NOT depends_on scorer: the app reads the scorer over HTTP lazily, per
    # request, and depends_on does not wait for readiness anyway — so this
    # only ever expressed a start ORDER. Keeping it would have forced the
    # (profiled) scorer into every `up` that starts the app, including a
    # quiz-only event that has no scorer image to pull. See scorer's profiles
    # below.
    depends_on: [srh]

  scorer:
    # The scorer belongs to the secure-development module, exactly as `sync`
    # does — it exists to score PRs against forked targets. A quiz-only event
    # has nothing for it to serve, so it is PROFILED rather than left in the
    # default set: with no profile, `docker compose --profile poll --profile
    # app up -d` pulled it on every event, and a quiz-only organizer (who has
    # no SCORE_IMAGE and no access to the private upstream fallback below)
    # could not bring the documented stack up at all.
    #
    # Both score-ingest modes need it — poll (sync submits to it) and push
    # (the fork's Action POSTs to it through caddy) — so it carries both, and
    # the documented poll-mode command is unchanged. Quiz-only events simply
    # pass neither. docs/hosting.md's "Which profiles do I need?" table is the
    # organizer-facing version of this comment.
    profiles: ["poll", "push"]
    # Set SCORE_IMAGE in .env to your own build from scorer/ (docs/scorer.md).
    # The fallback is the upstream image, which is private — it only pulls if
    # the OWASP-CTF maintainers granted you access. Kept as a fallback (not
    # required) so parse-time interpolation doesn't break the smoke override.
    image: ${SCORE_IMAGE:-ghcr.io/owasp-ctf/score:latest}
    command: ["score", "serve"]
    restart: unless-stopped
    environment:
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
      CTF_SCORE_BEARER_TOKEN: ${SCORER_TOKEN}   # requires upstream scorer bearer-auth mode
    depends_on: [srh]

  srh:
    # Pinned by digest: this third-party image sits in the score read/write path,
    # so a mutable :latest tag must not silently swap it out on a repull.
    image: hiett/serverless-redis-http:latest@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  sync:
    profiles: ["poll"]
    build: ./sync
    # unless-stopped would restart even on a clean exit 0 (e.g. a quiz-only
    # event.yaml with no polled module — see sync/src/index.js's main()),
    # turning "nothing to do" into a silent restart-loop. on-failure only
    # restarts on a genuine nonzero-exit crash.
    restart: on-failure
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      SCORER_TOKEN: ${SCORER_TOKEN}
      SCORER_URL: http://scorer:4000
      # Same srh proxy as app/scorer above — lets sync read the organizer's
      # pause flag (ctf:admin:settings) and publish its heartbeat
      # (ctf:sync:status). Without this, sync's redis client stays null and
      # the admin-panel freeze never reaches the poller.
      UPSTASH_REDIS_REST_URL: http://srh:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
    volumes:
      - ./event.yaml:/config/event.yaml:ro
      - sync-state:/state
    depends_on: [scorer, srh]

volumes:
  caddy-data:
  redis-data:
  sync-state:
