# Validates the AWS Terraform module on any change to it. Never applies infra —
# fmt + init(-backend=false) + validate + test only. Real applies are run by an
# operator locally (see docs/aws.md); this just keeps the module well-formed
# and its rendered bring-up script correct.
name: Terraform

on:
  push:
    branches: [main]
    paths: ["deploy/aws-terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["deploy/aws-terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws-terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate -no-color
      # validate never inspects RENDERED output, so it passed this module for
      # its entire life while the EC2 bring-up script was broken. Fargate has
      # no user-data to render; what these tests render at plan time via
      # mock_provider is the CONTAINER DEFINITIONS — that srh alone may reach
      # ElastiCache, that the connection is rediss:// and not redis://, that no
      # secret is baked in as plaintext instead of a valueFrom, and that
      # scorer/sync appear only for the modules the event actually runs.
      # No AWS credentials, no network, no apply.
      - name: test
        run: terraform test -no-color
