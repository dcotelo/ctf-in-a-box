name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sync/package-lock.json }
      - run: npm ci
        working-directory: sync
      - run: npm test
        working-directory: sync

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - run: shellcheck scripts/*.sh setup/*.sh
      - run: bats setup/test/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: corepack pnpm test
        working-directory: apps/web
      - run: BETTER_AUTH_SECRET=ci-dummy BETTER_AUTH_URL=http://localhost:3000 corepack pnpm build
        working-directory: apps/web
      - run: ./scripts/acceptance-app.sh
