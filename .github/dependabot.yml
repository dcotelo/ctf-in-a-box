version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/sync"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/scorer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # React refuses to run unless react and react-dom are the exact same
    # version, so they must bump in one PR (with their @types) — never apart.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Same rule, different reason. `next` and `eslint-config-next` are both
      # pinned EXACTLY (no caret) in apps/web/package.json, deliberately kept
      # on the same version — eslint-config-next ships the lint rules for the
      # Next it was released with. Ungrouped, dependabot opens one PR each;
      # they then edit the same two files, so the second conflicts and needs a
      # rebase, and merging one alone leaves main on a mismatched pair.
      #
      # This is not hypothetical: #161 and #164 arrived as exactly that split.
      next:
        patterns:
          - "next"
          - "eslint-config-next"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Base images are digest-pinned (issue #49), which is what makes a build
  # reproducible and a swapped image detectable. It also means a pin is frozen
  # until something moves it: a floating `node:22-alpine` silently picks up the
  # next 22.x patch, a pinned one never does. These entries are the half of the
  # trade that keeps a pin from quietly becoming a stale base — without them,
  # digest-pinning trades a supply-chain risk for an unpatched-CVE one.
  - package-ecosystem: "docker"
    directories:
      - "/sync"
      - "/scorer"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All three Dockerfiles run the SAME node base. Ungrouped, a bump opens
      # three PRs that must all land or the images drift apart — one service
      # on a different 22.x than the other two is a difference nobody chose.
      node-base:
        patterns:
          - "node"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # The AWS module pins its provider (and any future modules); without this
  # entry those pins never see an update PR — the only ecosystem in the repo
  # that was left out.
  - package-ecosystem: "terraform"
    directory: "/deploy/aws-terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
