# CTF scoring workflow — self-contained, no upstream score-action.
#
# INSTALL: the organizer commits this to EACH forked target repo as
#   .github/workflows/ctf-score.yml
# (matches the instructions printed by `setup/ctf-setup.sh org`). Then disable
# inherited/upstream workflows in the fork's Settings > Actions.
#
# FILL IN the placeholders below (marked <...>). `ctf-setup.sh render` fills them
# all in for you; this is only the reference for a hand edit.
#
# WHY pull_request_target: the contestant's PR comes from a fork, so a plain
# `pull_request` run would have a read-only token and could not post the score
# comment. pull_request_target runs in the BASE repo's context with a writable
# token. The tradeoff — it can see secrets — is safe here because the PR's code
# is only ever `docker build`+run INSIDE a container on an internal network
# (see the checkout + run steps); it is never executed on the runner host.
#
# WHY the comment author matters: the kit's sync poller (sync/src/parse.js)
# only trusts score comments authored by github-actions[bot]. Posting via
# actions/github-script with the default GITHUB_TOKEN makes the comment author
# github-actions[bot], so the poll picks it up. Do NOT swap in a PAT or a
# third-party commenter action — that breaks the trust filter.

# ---------------------------------------------------------------------------
# PLACEHOLDERS — edit these:
#   <EVENT_ORG>  the GitHub org the scorer image was mirrored into
#                (ghcr.io/<EVENT_ORG>/score:latest — keep the package private
#                only if you baked a rubric you want hidden; the stock
#                vendored rubric is public in the kit's own repo)
#   <TARGET>     this repo's rubric target id (must match a target the baked
#                rubric defines — a <target>/ directory with
#                tests/challenges/catalogue.<target>.json for an exec rubric,
#                or a <target>.yaml for a declarative one; e.g. juice-shop)
#   <APP_URL>    where the app under test answers ON the ctf network, e.g.
#                http://<TARGET>:3000 (no host ports are published)
#   <LEADERBOARD_LINK>  event.url + /leaderboard — the score comment links here.
#                Leave empty/unfilled to omit the leaderboard link.
#
# KNOB (not a placeholder): COOLDOWN_MINUTES in the job env below — minimum
# minutes between scored runs on one PR (default 5, see the cooldown step).
#
# KNOB (not a placeholder): CTF_DISCLOSE_TABLE — set the repo/org Actions
# variable `CTF_DISCLOSE_TABLE` to `0`/`false` to hide the per-challenge table
# in the score comment (the progress bar + patched count still show, and the
# leaderboard keeps full detail). Unset/anything else discloses the table.
# ---------------------------------------------------------------------------

name: CTF Patch Score

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read
  pull-requests: write

# One scoring run per PR at a time; a new push cancels the superseded run.
# Without this, two overlapping runs can interleave their comment upserts and
# leave a stale "⏳ Scoring in progress…" body on top of a finished result.
concurrency:
  group: ctf-score-<TARGET>-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      EVENT_ORG: <EVENT_ORG>
      TARGET: <TARGET>
      APP_URL: <APP_URL>
      # Rendered from event.url by ctf-setup.sh; the score comment links here.
      # Empty (or left as the placeholder) simply omits the leaderboard link.
      LEADERBOARD_LINK: <LEADERBOARD_LINK>
      NETWORK: ctfnet
      COOLDOWN_MINUTES: "5"
    steps:
      # (1) Re-run cooldown — the rate cap docs/modules.md §6.3 requires. WHY:
      # every scoring run hands the contestant a fresh per-challenge ✅/❌
      # verdict — a fast, free oracle. Rapid re-pushes let them iterate a
      # check-gaming patch against the baked rubric (tweak, push, read the
      # ❌s, repeat); the cooldown bounds that feedback loop (and, secondarily,
      # Actions minutes). If the previous RESULT comment is younger than
      # COOLDOWN_MINUTES, this push is not scored; the comment gains a note
      # telling the contestant when pushing again will be scored. A leftover
      # "⏳" pending body never triggers the cooldown — that means the previous
      # run died or was cancelled, and must not lock the contestant out.
      - name: Re-run cooldown gate
        id: cooldown
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('skip', 'false');
            const cooldownMs = Number(process.env.COOLDOWN_MINUTES || 5) * 60 * 1000;
            const marker = `<!-- ctf-score:${process.env.TARGET} -->`;
            const untilRe = /<!-- ctf-score-cooldown-until:(\S+) -->/;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (!existing) return; // first run on this PR — nothing to rate-limit
            if (existing.body.includes('⏳ Scoring in progress')) return; // stale pending
            // If a cooldown deadline is already stamped in the comment, honor it
            // without editing (an edit would bump updated_at and re-arm the
            // window on every push, extending the lockout indefinitely).
            const stamped = existing.body.match(untilRe);
            const until = stamped
              ? new Date(stamped[1]).getTime()
              : new Date(existing.updated_at).getTime() + cooldownMs;
            if (Date.now() >= until) return; // cooldown over — score this push
            if (!stamped) {
              const note = `\n\n⏱️ On cooldown — this push was **not scored**. ` +
                `Push again after ${new Date(until).toUTCString()} to be re-scored. ` +
                `<!-- ctf-score-cooldown-until:${new Date(until).toISOString()} -->`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: existing.body + note,
              });
            }
            core.setOutput('skip', 'true');

      # (2) Upsert a "scoring in progress" comment so the contestant sees the
      # run started. Target-scoped marker lets multiple target workflows coexist
      # on one PR without clobbering each other's comments.
      - name: Post pending comment
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `<!-- ctf-score:${process.env.TARGET} -->`;
            const body = `${marker}\n## 🏆 CTF Patch Score\n\n⏳ Scoring in progress…`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # (3) Check out the PR HEAD — this is UNTRUSTED contestant code. It is only
      # ever `docker build`+run inside a container on the internal network by the
      # scorer (step 6); nothing here runs it on the runner host.
      - name: Checkout PR head
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # (4) Log in to GHCR to pull the (private) mirrored scorer image.
      - name: Log in to GHCR
        if: steps.cooldown.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # (5) Pull the scorer image EXPLICITLY, in a step named for it.
      #
      # `docker run` in step (7) would pull it implicitly, which is how this
      # used to work — and it made the ONE provisioning step that has no API
      # (the per-fork package Read grant, granted by hand under the package's
      # "Manage Actions access") fail as a docker error buried in the middle
      # of the scorer's own step, which then posted "Scoring did not complete"
      # to the contestant's PR. A setup problem that reads as a scoring
      # problem is the worst possible framing: the contestant re-pushes, and
      # the organizer has no reason to look at the package settings.
      #
      # A `denied`/`unauthorized`/`not found` reply is specifically NOT a
      # network flake — it means either this repository was never granted Read
      # on the package, or the image was never mirrored into the org at all.
      # Both are the organizer's to fix and neither is the contestant's fault,
      # so this says so, in those words, and hands step (9) a flag to say it
      # again on the PR rather than blaming the patch.
      - name: Pull scorer image
        id: pull
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          set +e
          out="$(docker pull "ghcr.io/${EVENT_ORG}/score:latest" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] && exit 0
          if printf '%s' "$out" | grep -qiE 'denied|unauthorized|authentication required|not found|manifest unknown'; then
            echo "denied=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Scorer image unavailable::This is an event SETUP problem, not a problem with the pull request."
            {
              echo "## Scorer image could not be pulled"
              echo
              echo "\`ghcr.io/${EVENT_ORG}/score:latest\` was refused. Nothing about the"
              echo "submitted patch has been judged. **An organizer** needs to fix one of:"
              echo
              echo "1. Grant THIS repository Read on the package — <https://github.com/orgs/${EVENT_ORG}/packages>,"
              echo "   open \`score\`, *Manage Actions access*, *Add repository*. There is no API"
              echo "   for this step, so it is done by hand once per fork."
              echo "2. Mirror the image into the org if it was never pushed:"
              echo "   \`./setup/ctf-setup.sh mirror\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # (6) Create the ctf network the scorer attaches itself and the app to.
      - name: Create ctf network
        if: steps.cooldown.outputs.skip != 'true'
        run: docker network create "$NETWORK" 2>/dev/null || true

      # (7) Run the scorer. --entrypoint drives the judge path (boot app + probe).
      # docker.sock lets it boot the app under test as a sibling container; the
      # workspace + event.json mounts give it the PR checkout and webhook payload.
      # Push-mode secrets are OPTIONAL: leave LEADERBOARD_URL/LEADERBOARD_TOKEN
      # unset for poll mode (the engine skips the leaderboard POST and the sync
      # poller records the comment instead).
      - name: Run scorer
        id: score
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          # SECURITY: the scorer writes ctf-score.md (which carries the sync
          # ingest marker posted as github-actions[bot]) to a DEDICATED output
          # dir OUTSIDE the untrusted PR checkout — never into $GITHUB_WORKSPACE.
          # The final-comment step reads it only from here, only on this step's
          # success, so a contestant cannot commit their own ctf-score.md and
          # have a forged score posted as the bot.
          mkdir -p "$RUNNER_TEMP/ctf-out"
          docker run --rm \
            --entrypoint /usr/local/bin/entrypoint.sh \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -v "$RUNNER_TEMP/ctf-out:/ctf-out" \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -e TARGET \
            -e APP_URL \
            -e NETWORK \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e CTF_OUT_DIR=/ctf-out \
            -e GITHUB_EVENT_PATH=/github/event.json \
            -e SCORE_API="${{ secrets.LEADERBOARD_URL }}" \
            -e SCORE_TOKEN="${{ secrets.LEADERBOARD_TOKEN }}" \
            -e CTF_DISCLOSE_TABLE="${{ vars.CTF_DISCLOSE_TABLE }}" \
            "ghcr.io/${EVENT_ORG}/score:latest"

      # (8) Always upsert the final comment, replacing the pending one (same
      # marker). ctf-score.md already carries the sync JSON marker
      # (<!-- ctf-score: {...} -->) that the poller parses; we keep the
      # target-scoped marker AND the file body together. If the score step failed
      # or produced no file, fall back to a "did not complete" message with a run
      # link — mirroring the upstream action's failure behaviour. Gated on the
      # cooldown skip too: a skipped run writes no ctf-score.md, and this step
      # must not clobber the previous (still fresh) result with a "did not
      # complete" body — the cooldown step already annotated the comment.
      - name: Post final comment
        if: always() && steps.cooldown.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SCORE_OUTCOME: ${{ steps.score.outcome }}
          PULL_DENIED: ${{ steps.pull.outputs.denied }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- ctf-score:${process.env.TARGET} -->`;
            // SECURITY: read the report ONLY from the scorer's dedicated output
            // dir (outside the untrusted PR checkout) AND only when the scorer
            // step actually succeeded. Reading from the checkout, or on failure,
            // would let a contestant post a forged sync marker as the bot.
            const path = `${process.env.RUNNER_TEMP}/ctf-out/ctf-score.md`;
            let report = '';
            if (process.env.SCORE_OUTCOME === 'success') {
              try { report = fs.readFileSync(path, 'utf8'); } catch {}
            }
            // Leaderboard link footer — only when the organizer's URL was rendered
            // in (a real http(s) URL, not the unfilled placeholder).
            const lb = (process.env.LEADERBOARD_LINK || '').trim();
            const footer = /^https?:\/\//.test(lb) ? `\n\n📊 [View the leaderboard](${lb})` : '';
            let body;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (report && report.trim()) {
              body = `${marker}\n${report}`;
            } else if (process.env.PULL_DENIED === 'true') {
              // The scorer image was refused, so NOTHING about this patch was
              // judged. Saying "scoring did not complete" here would read as a
              // verdict on the submission and send the contestant back to
              // re-push a patch that was never looked at — while the organizer,
              // who is the only one who can fix it, has no reason to look at
              // the package settings. Name the real cause instead.
              body =
                `${marker}\n## 🏆 CTF Patch Score\n\n` +
                `⚠️ **Not scored — this is an event setup problem, not a problem with your patch.**\n\n` +
                `The scoring image could not be pulled, so nothing here has been judged yet. ` +
                `Your pull request is fine as it is; an organizer needs to grant this repository ` +
                `access to the scorer package. Nothing to do on your side — once that is fixed, ` +
                `push again (or ask an organizer to re-run) and this comment will be replaced with your score.\n\n` +
                `<sub>Organizers: see the [run log](${runUrl}) — the failing step's summary has the two-line fix.</sub>`;
            } else {
              body = `${marker}\n## 🏆 CTF Patch Score\n\n❌ Scoring did not complete. See the [run log](${runUrl}).`;
            }
            body += footer;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
